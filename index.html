<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seiten</title>
<style>
  :root { --bg: #f6f1e7; --card: #fffdf8; --text: #3a2f25; --muted: #85766a; --line: #e6dccb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1a15; --card: #2a231c; --text: #f0e6d8; --muted: #b3a493; --line: #3e342a; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-top: 12px; color: inherit; text-decoration: none; }
  span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Seiten</h1>
  <a class="card" href="hof/"><b>Zickenstall</b><br><span>Bella und die anderen Tiere</span></a>
</main>
</body>
</html>
